[project]
name = "multimodal-rag-backend"
version = "0.1.0"
decription = "Backend for the Full-Stack Multimodal RAG Knowledge Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.14.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
