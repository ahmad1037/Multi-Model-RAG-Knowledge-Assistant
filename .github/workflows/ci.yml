name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm

        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://rag_user:rag_password@localhost:5432/rag_test
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      - name: Enable pgvector
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -U rag_user -d rag_test
          -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Test backend
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build