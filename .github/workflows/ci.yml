name: CI


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend:

    name: Backend

    runs-on: ubuntu-latest


    services:

      postgres:

        image: pgvector/pgvector:pg17

        env:

          POSTGRES_USER: rag_user

          POSTGRES_PASSWORD: rag_password

          POSTGRES_DB: rag_db

        ports:

          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U rag_user -d rag_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      redis:

        image: redis:7-alpine

        ports:

          - 6379:6379

        options: >-
          --health-cmd
          "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:

      DATABASE_URL:
        postgresql+psycopg://rag_user:rag_password@localhost:5432/rag_db

      REDIS_URL:
        redis://localhost:6379/0

      CELERY_BROKER_URL:
        redis://localhost:6379/0

      CELERY_RESULT_BACKEND:
        redis://localhost:6379/1

      STORAGE_ROOT:
        /tmp/rag-storage

      LLM_PROVIDER:
        ollama

      OLLAMA_BASE_URL:
        http://localhost:11434


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Install uv

        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

        with:

          version: latest-known


      - name: Install Python

        working-directory: backend

        run: uv python install 3.12


      - name: Install dependencies

        working-directory: backend

        run: uv sync --frozen


      - name: Enable pgvector

        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -U rag_user -d rag_db
          -c "CREATE EXTENSION IF NOT EXISTS vector;"


      - name: Run database migrations

        working-directory: backend

        run: uv run alembic upgrade head


      - name: Ruff

        working-directory: backend

        run: uv run ruff check app tests


      - name: Pytest

        working-directory: backend

        run: uv run pytest -q

  frontend:

    name: Frontend

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Setup Node

        uses: actions/setup-node@v7

        with:

          node-version: 22

          cache: npm

          cache-dependency-path:
            frontend/package-lock.json


      - name: Install dependencies

        working-directory: frontend

        run: npm ci


      - name: Production build

        working-directory: frontend

        run: npm run build
        
      - name: Build frontend image

        run: |
          docker build \
            -t multimodal-rag-frontend:ci \
            ./frontend

  docker:

    name: Docker

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Validate Compose

        run: |
          cp .env.example .env
          docker compose config -q


      - name: Build backend image

        run: |
          docker build \
            -t multimodal-rag-backend:ci \
            ./backend
