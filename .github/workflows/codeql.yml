name: CodeQL


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 4 * * 1"


jobs:

  analyze:

    runs-on: ubuntu-latest


    permissions:

      security-events: write

      packages: read

      contents: read


    strategy:

      matrix:

        language:
          - python
          - javascript-typescript


    steps:

      - name: Checkout

        uses:
          actions/checkout@v7


      - name: Initialize CodeQL

        uses:
          github/codeql-action/init@v3

        with:

          languages:
            ${{ matrix.language }}


      - name: Analyze

        uses:
          github/codeql-action/analyze@v3