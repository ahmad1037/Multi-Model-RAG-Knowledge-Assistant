name: Publish Backend Image


on:

  workflow_dispatch:

  push:
    branches:
      - main


permissions:

  contents: read

  packages: write


jobs:

  publish:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v7


      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username:
            ${{ github.actor }}

          password:
            ${{ secrets.GITHUB_TOKEN }}


      - name: Setup Buildx

        uses:
          docker/setup-buildx-action@v4


      - name: Build and push

        uses:
          docker/build-push-action@v7

        with:

          context: ./backend

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/multimodal-rag-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/multimodal-rag-backend:latest