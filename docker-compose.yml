services:

  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
    command:
    - sh
    - -c
    - >
      uv run alembic upgrade head &&
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV}
      TEXT_EMBEDDING_MODEL: ${TEXT_EMBEDDING_MODEL}
      TEXT_EMBEDDING_DIMENSION: ${TEXT_EMBEDDING_DIMENSION}
      TEXT_EMBEDDING_BATCH_SIZE: ${TEXT_EMBEDDING_BATCH_SIZE}
      TEXT_EMBEDDING_DEVICE: ${TEXT_EMBEDDING_DEVICE:-cuda}
      TEXT_QUERY_INSTRUCTION: ${TEXT_QUERY_INSTRUCTION}
      HNSW_EF_SEARCH: ${HNSW_EF_SEARCH}

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}

      STORAGE_ROOT: /storage

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen3:8b}
      VERIFICATION_MODEL: ${VERIFICATION_MODEL:-qwen3:8b}
      GENERATION_PROMPT_VERSION: ${GENERATION_PROMPT_VERSION:-grounded-answer-v1}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0}
      MAX_GROUNDING_RETRIES: ${MAX_GROUNDING_RETRIES:-1}
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /cache/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
  
    volumes:
    - ./storage:/storage
    - huggingface_cache:/root/.cache/huggingface


    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)"
        ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s


  frontend:
    build:
      context: ./frontend

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    ports:
      - "5173:5173"

    depends_on:
      backend:
        condition: service_healthy
  prometheus:

    image: prom/prometheus:v3.14.0

    volumes:

      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:

      - "9090:9090"

    depends_on:

      - backend
  grafana:

    image: grafana/grafana:13.2.1

    volumes:

      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

      - grafana_data:/var/lib/grafana

    ports:

      - "3000:3000"

    depends_on:

      - prometheus


volumes:

  postgres_data:

  huggingface_cache:

  grafana_data: